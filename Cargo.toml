[package]
name = "disclude"
version = "0.1.0"
edition = "2021"
description = "Detect obfuscation in source code packages"
license = "MIT"
repository = "https://github.com/disclude-io/disclude-rs"

[lib]
name = "disclude"
path = "src/lib.rs"

[[bin]]
name = "disclude"
path = "src/main.rs"

[[test]]
name = "scan_fixtures"
path = "tests/integration/scan_fixtures.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
ignore = "0.4"
flate2 = "1.0"
rayon = "1"
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[profile.release]
lto = "thin"
