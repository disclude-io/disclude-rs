[package]
name = "disclude"
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/disclude-io/disclude-rs"
readme = "README.md"
keywords = ["cybersecurity"]
description = "Detect obfuscation in source code"

[lib]
name = "disclude"
path = "src/lib.rs"

[[bin]]
name = "disclude"
path = "src/main.rs"

[[test]]
name = "scan_fixtures"
path = "tests/integration/scan_fixtures.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
ignore = "0.4.25"
flate2 = "1.1.9"
rayon = "1.12.0"
tree-sitter = "0.26.8"
tree-sitter-c = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-bash = "0.25.1"

[profile.release]
lto = "thin"
